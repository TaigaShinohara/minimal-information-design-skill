name: "minimal_information_design"
title: "情報量を減らすデザイン"
description: "アプリの情報量を減らし認知負荷を下げ、読まなくても直感的に使えるようにする。文字は最低限にし増やすほど伝わらない前提で、アイコン・図形・画像・操作UIへ置き換え、ページ分割と折りたたみで同時表示を減らし、重要でないものは切り捨てるか別場所へまとめ、アニメーションで段階表示し、色・形・フォントの種類を増やさず、情報は重要度順に上から下・左から右、主要ボタンは手の構造上 下部・右下に置くことを義務づける。"
category: "Design"
include_in_prompt: true
